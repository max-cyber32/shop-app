<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Store Glass iOS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: rgba(30, 30, 30, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-green: #00ff87;
            --accent-glow: rgba(0, 255, 135, 0.35);
            --text-color: #f5f5f7;
            --text-dim: #a1a1a6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 90px; overflow-x: hidden; }

        /* Эффект жидкого стекла (Glassmorphism) */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
        }

        /* Поиск и Фильтры */
        .header-search { padding: 15px; position: sticky; top: 0; z-index: 10; background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(15px); }
        .search-box { display: flex; gap: 10px; }
        .search-input { flex: 1; background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 14px; padding: 10px 15px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-glow); }
        .filter-btn { background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 14px; padding: 0 15px; color: var(--accent-green); font-weight: 600; cursor: pointer; transition: 0.2s; }
        .filter-btn:active { scale: 0.95; }

        /* Сетка товаров */
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 15px; }
        .product-card {
            padding: 12px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }
        .product-card:hover, .product-card:active {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }
        .product-img { width: 100%; height: 140px; object-fit: cover; border-radius: 14px; margin-bottom: 10px; }
        .product-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.2; }
        .product-price { font-size: 16px; font-weight: 700; color: var(--accent-green); margin-bottom: 8px; }

        /* Нижнее меню iOS */
        .nav-bar {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            height: 65px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-dim); font-size: 11px; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: var(--accent-green); font-weight: 600; }
        .nav-icon { font-size: 20px; }

        /* Экран детального просмотра товара (Модальное окно) */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(25px);
            z-index: 200;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .close-btn { align-self: flex-end; font-size: 24px; color: var(--text-dim); cursor: pointer; padding: 5px; }
        .sizes-row { display: flex; gap: 8px; margin: 15px 0; }
        .size-chip { padding: 8px 16px; background: #2c2c2e; border-radius: 10px; font-size: 13px; cursor: pointer; border: 1px solid transparent; }
        .size-chip.active { border-color: var(--accent-green); background: rgba(0, 255, 135, 0.15); color: var(--accent-green); font-weight: bold; }
        .size-chip.disabled { opacity: 0.3; text-decoration: line-through; cursor: not-allowed; }

        .add-to-cart-btn {
            background: linear-gradient(135deg, #00ff87, #60efff);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            cursor: pointer;
            margin-top: auto;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: 0.2s;
        }
        .add-to-cart-btn:active { scale: 0.98; }
    </style>
</head>
<body>

    <!-- Шапка поиска -->
    <div class="header-search">
        <div class="search-box">
            <input type="text" class="search-input" placeholder="Поиск товаров..." id="searchInput">
            <button class="filter-btn" onclick="openFilters()">Фильтры</button>
        </div>
    </div>

    <!-- Каталог товаров -->
    <div class="products-grid" id="productsGrid">
        <!-- Пример карточки 1 -->
        <div class="product-card glass" onclick="openProduct(1)">
            <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=400" class="product-img">
            <div class="product-title">Oversize Black Hoodie</div>
            <div class="product-price">1 800 грн</div>
        </div>
        <!-- Пример карточки 2 -->
        <div class="product-card glass" onclick="openProduct(2)">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" class="product-img">
            <div class="product-title">Nike Air Max Red</div>
            <div class="product-price">3 200 грн</div>
        </div>
    </div>

    <!-- Модальный экран товара -->
    <div class="modal" id="productModal">
        <span class="close-btn" onclick="closeProduct()">&times;</span>
        <img src="" id="modalImg" style="width:100%; height:250px; object-fit:cover; border-radius:18px; margin-bottom:15px;">
        <h2 id="modalTitle" style="font-size:20px; margin-bottom:8px;"></h2>
        <div id="modalPrice" style="font-size:22px; color:var(--accent-green); font-weight:bold; margin-bottom:12px;"></div>
        <p id="modalDesc" style="color:var(--text-dim); font-size:14px; line-height:1.4; margin-bottom:15px;">Премиальный хлопок, свободный крой, фирменный вышитый логотип на груди.</p>
        
        <div style="font-size:14px; font-weight:600;">Выберите размер:</div>
        <div class="sizes-row" id="sizesRow">
            <div class="size-chip active">S</div>
            <div class="size-chip">M</div>
            <div class="size-chip disabled">L (Нет)</div>
            <div class="size-chip">XL</div>
        </div>

        <button class="add-to-cart-btn">Добавить в корзину</button>
    </div>

    <!-- Нижняя навигация iOS -->
    <div class="nav-bar glass">
        <div class="nav-item active" onclick="switchTab('goods')">
            <span class="nav-icon">🛍</span>
            <span>Товары</span>
        </div>
        <div class="nav-item" onclick="switchTab('search')">
            <span class="nav-icon">🔍</span>
            <span>Поиск</span>
        </div>
        <div class="nav-item" onclick="switchTab('cart')">
            <span class="nav-icon">🛒</span>
            <span>Корзина</span>
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function openProduct(id) {
            document.getElementById('modalImg').src = id === 1 
                ? "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=400" 
                : "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400";
            document.getElementById('modalTitle').innerText = id === 1 ? "Oversize Black Hoodie" : "Nike Air Max Red";
            document.getElementById('modalPrice').innerText = id === 1 ? "1 800 грн" : "3 200 грн";
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeProduct() {
            document.getElementById('productModal').style.display = 'none';
        }
    </script>
</body>
</html>
